<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#F9F7F2" />

  <!-- Subtle outer stationery card -->
  <rect x="64" y="64" width="384" height="384" rx="56" fill="#FFFDF9" stroke="#E6E1D6" stroke-width="4" />

  <!-- Open diary book spine & pages -->
  <path
    d="M124 166 C124 152, 135 142, 149 142 L238 142 C248 142, 256 150, 256 160 L256 364 C256 355, 248 348, 238 348 L149 348 C135 348, 124 338, 124 324 Z"
    fill="#F9F7F2"
    stroke="#2C2A29"
    stroke-width="6"
    stroke-linejoin="round"
  />
  <path
    d="M388 166 C388 152, 377 142, 363 142 L274 142 C264 142, 256 150, 256 160 L256 364 C256 355, 264 348, 274 348 L363 348 C377 348, 388 338, 388 324 Z"
    fill="#FFFDF9"
    stroke="#2C2A29"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Left page stationery ruled lines -->
  <line x1="154" y1="194" x2="226" y2="194" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />
  <line x1="154" y1="226" x2="226" y2="226" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />
  <line x1="154" y1="258" x2="212" y2="258" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />
  <line x1="154" y1="290" x2="226" y2="290" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />

  <!-- Right page stationery ruled lines -->
  <line x1="286" y1="194" x2="358" y2="194" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />
  <line x1="286" y1="226" x2="358" y2="226" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />
  <line x1="286" y1="258" x2="340" y2="258" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />
  <line x1="286" y1="290" x2="352" y2="290" stroke="#E6E1D6" stroke-width="5" stroke-linecap="round" />

  <!-- Soft warm glimmer halo -->
  <circle cx="256" cy="242" r="44" fill="#9E4737" fill-opacity="0.12" />

  <!-- 4-point warm glimmer star between the pages -->
  <path
    d="M256 196 C260 226, 272 238, 302 242 C272 246, 260 258, 256 288 C252 258, 240 246, 210 242 C240 238, 252 226, 256 196 Z"
